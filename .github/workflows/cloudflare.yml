name: Deploy PageScript to Cloudflare

on:
  push:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: pagescript-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://pagescript.olivermorrow.com
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.0
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          target: wasm32-unknown-unknown
          cache: true

      - name: Check the compiler
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build and verify the static site
        run: |
          cargo install wasm-pack --version 0.14.0 --locked
          bash scripts/build-site.sh
          npm ci --ignore-scripts
          ./node_modules/.bin/cf deploy ./_site --dry-run

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN Actions secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID Actions variable}"
          ./node_modules/.bin/cf deploy ./_site --message "${GITHUB_SHA}"

      - name: Verify the public site
        run: |
          site=https://pagescript.olivermorrow.com
          curl --fail --silent --show-error --location --retry 15 --retry-delay 8 --retry-all-errors --max-time 20 \
            "$site/" -o "$RUNNER_TEMP/pagescript-index.html"
          grep -Fq 'A page format for coding agents' "$RUNNER_TEMP/pagescript-index.html"
          curl --fail --silent --show-error --max-time 20 "$site/playground/compiler/pagescript_bg.wasm" -o "$RUNNER_TEMP/pagescript.wasm"
          cmp _site/playground/compiler/pagescript_bg.wasm "$RUNNER_TEMP/pagescript.wasm"
          curl --fail --silent --show-error --max-time 20 "$site/benchmarks/token-counts.json" -o "$RUNNER_TEMP/token-counts.json"
          cmp _site/benchmarks/token-counts.json "$RUNNER_TEMP/token-counts.json"
