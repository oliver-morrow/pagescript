name: Docs

on:
  push:
    branches: [main]
    paths:
      - README.md
      - SPEC.md
      - RATIONALE.md
      - CONFORMANCE.md
      - docs/**
      - examples/**
      - schemas/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static docs artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Validate docs JSON assets
        run: |
          set -euo pipefail
          for file in schemas/*.json examples/*.json conformance/**/*.json; do
            jq empty "$file"
          done

      - name: Validate PageScript docs source
        run: cargo run -p pagescript-rs --locked -- validate docs/index.page

      - name: Build static docs
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/docs _site/examples _site/schemas _site/conformance

          cp README.md SPEC.md RATIONALE.md CONFORMANCE.md CHANGELOG.md LICENSE _site/
          cp -R docs/. _site/docs/
          cp -R examples/. _site/examples/
          cp -R schemas/. _site/schemas/
          cp -R conformance/. _site/conformance/
          cargo run -p pagescript-rs --locked -- render docs/index.page --page pagescript-docs > _site/index.html
          cargo run -p pagescript-rs --locked -- render examples/product-metrics-demo.page --page product-metrics-demo > _site/examples/product-metrics-demo.html
          grep -F 'PageScript' _site/index.html
          grep -F 'ps-runtime-config' _site/index.html
          grep -F 'Product Metrics' _site/examples/product-metrics-demo.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
