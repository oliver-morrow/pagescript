name: Docs

on:
  push:
    branches: [main]
    paths:
      - README.md
      - SPEC.md
      - docs/**
      - examples/**
      - benchmarks/**
      - schemas/**
      - conformance/**
      - rust/**
      - web/**
      - skills/pagescript/**
      - scripts/build-site.sh
      - scripts/render-benchmarks.mjs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify the static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Build and verify the static site
        run: bash scripts/build-site.sh
