name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true

      - name: Verify
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked
          for file in schemas/*.json conformance/**/*.json examples/*.json; do
            jq empty "$file"
          done

  binaries:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: pagescript-rs
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: pagescript-rs
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: pagescript-rs
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: pagescript-rs.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true

      - name: Build release binary
        run: cargo build -p pagescript-rs --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.tag }}"
          fi
          package="pagescript-rs-${version}-${{ matrix.target }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${package}/"
          cp README.md LICENSE CHANGELOG.md "dist/${package}/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a "${package}.zip" "${package}")
          else
            (cd dist && tar -czf "${package}.tar.gz" "${package}")
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pagescript-rs-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --notes-file CHANGELOG.md
          fi

  crates:
    name: Publish crate
    needs: verify
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Dry-run publish
        run: cargo publish -p pagescript-rs --locked --dry-run

      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish -p pagescript-rs --locked --token "$CARGO_REGISTRY_TOKEN"

      - name: Skip crates.io publish
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish."

