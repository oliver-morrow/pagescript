<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build summary</title>
  <style>
    body { margin: 0; background: #fbfcfe; color: #182c4b; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(660px, calc(100% - 36px)); margin: 24px auto; }
    h1 { margin: 0; font-size: clamp(28px, 7vw, 48px); line-height: .98; }
    p { margin: 8px 0 20px; }
    dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 0; }
    dl div { min-width: 0; padding: 12px; border: 1px solid #becddd; border-radius: 8px; background: #edf3f9; }
    dt { color: #3a5b8a; font-size: .85rem; font-weight: 600; }
    dd { margin: 4px 0 0; font-size: clamp(20px, 5vw, 30px); font-weight: 800; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>Build summary</h1>
    <p>Example CI run for the search API.</p>
    <dl>
      <div><dt>Checks passed</dt><dd>28 / 28</dd></div>
      <div><dt>Duration</dt><dd>2m 18s</dd></div>
      <div><dt>Line coverage</dt><dd>87%</dd></div>
      <div><dt>Artifact size</dt><dd>6.4 MB</dd></div>
    </dl>
  </main>
</body>
</html>
