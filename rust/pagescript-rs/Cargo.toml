[package]
name = "pagescript-rs"
version = "1.0.0"
edition = "2024"
default-run = "pagescript-rs"
description = "Rust compiler and CLI for PageScript .page files."
license = "MIT"
repository = "https://github.com/oliver-morrow/pagescript"
homepage = "https://oliver-morrow.github.io/pagescript/"
documentation = "https://docs.rs/pagescript-rs"
keywords = ["pagescript", "html", "compiler", "llm", "static-site"]
categories = ["command-line-utilities", "compilers", "template-engine"]
readme = "README.md"
include = ["Cargo.toml", "README.md", "src/**/*.rs", "stdlib/**/*.page"]

[lib]
name = "pagescript_rs"
path = "src/lib.rs"

[[bin]]
name = "pagescript"
path = "src/bin/pagescript.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
jsonschema = "0.18"
