[package]
name = "pagescript-web"
version = "0.1.0"
edition = "2024"
description = "Browser bindings for the PageScript compiler"
license = "MIT"
repository = "https://github.com/oliver-morrow/pagescript"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pagescript-rs = { path = "../pagescript-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.121"
